<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dibujo — herramientas</title>
    <link rel="stylesheet" href="/src/portada/styles.css" />
  </head>
  <body>
    <main class="portada">
      <header>
        <h1>Dibujo</h1>
        <p>Herramientas para trabajar sobre papel.</p>
      </header>

      <div class="tools">
        <a class="tool" href="./marco/">
          <span class="tool-art">
            <!-- Un cuadro colgado: marco, passe-partout y la obra adentro. -->
            <svg viewBox="0 0 200 140" aria-hidden="true">
              <defs>
                <linearGradient id="moldura" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#8a5c33" />
                  <stop offset="0.5" stop-color="#6b4326" />
                  <stop offset="1" stop-color="#4a2d18" />
                </linearGradient>
              </defs>
              <rect x="54" y="18" width="92" height="112" rx="2" fill="url(#moldura)" />
              <rect x="64" y="28" width="72" height="92" fill="#efece4" />
              <rect x="74" y="38" width="52" height="72" fill="#f7f5ef" />
              <path
                d="M100 104V56M100 70c-8-6-14-4-16-2 3 5 10 7 16 2Zm0 12c8-6 14-4 16-2-3 5-10 7-16 2Zm0-24c-8-6-14-4-16-2 3 5 10 7 16 2Z"
                fill="none"
                stroke="#3a332c"
                stroke-width="1.6"
                stroke-linecap="round"
              />
            </svg>
          </span>
          <span class="tool-body">
            <strong>Cuadros</strong>
            <em>
              Probá marcos, passe-partout y vidrios sobre tu dibujo, y salí con las
              medidas para encargarlo.
            </em>
          </span>
        </a>

        <span class="tool is-wip" aria-disabled="true">
          <span class="tool-art">
            <!-- Una foto con la grilla de referencia encima. -->
            <svg viewBox="0 0 200 140" aria-hidden="true">
              <rect x="46" y="26" width="108" height="88" rx="2" fill="#2c3a46" />
              <circle cx="80" cy="56" r="12" fill="#d8c38a" />
              <path d="M46 114l30-34 22 20 18-14 38 28z" fill="#4a5f5a" />
              <g stroke="rgba(255,255,255,0.55)" stroke-width="1">
                <path d="M73 26v88M100 26v88M127 26v88M46 48h108M46 70h108M46 92h108" />
              </g>
              <rect
                x="46"
                y="26"
                width="108"
                height="88"
                rx="2"
                fill="none"
                stroke="rgba(255,255,255,0.7)"
                stroke-width="1.5"
              />
            </svg>
          </span>
          <span class="tool-body">
            <strong>Grilla<b class="badge">en obra</b></strong>
            <em>
              Poné una grilla sobre una foto y ajustá los bordes, para copiarla a
              papel con referencia.
            </em>
          </span>
        </span>
      </div>
    </main>
  </body>
</html>
